services:
  postgres:
    image: postgres:16
    container_name: health_tracker_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: health_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: health_tracker_backend
    environment:
      # コンテナ内では postgres サービス名で DB に接続する
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/health_tracker
      PORT: 3000
      ENABLE_SWAGGER: "true"
      # フロントエンドはローカル npm run dev で起動するため localhost を許可
      CORS_ORIGIN: "http://localhost:5173,http://localhost:5174"
      # Cognito（実値は .env で上書きする。ここではダミー値を既定とする）
      COGNITO_REGION: "${COGNITO_REGION:-ap-northeast-1}"
      COGNITO_USER_POOL_ID: "${COGNITO_USER_POOL_ID:-ap-northeast-1_example}"
      COGNITO_CLIENT_ID: "${COGNITO_CLIENT_ID:-example-client-id}"
      COGNITO_USERINFO_URL: "${COGNITO_USERINFO_URL:-https://example.auth.ap-northeast-1.amazoncognito.com/oauth2/userInfo}"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
