services:
  postgres:
    image: postgres:16
    container_name: health_tracker_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: health_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: health_tracker_backend
    environment:
      # コンテナ内では postgres サービス名で DB に接続する
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/health_tracker
      PORT: 3000
      ENABLE_SWAGGER: "true"
      # フロントエンドはローカル npm run dev で起動するため localhost を許可
      CORS_ORIGIN: "http://localhost:5173,http://localhost:5174"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
