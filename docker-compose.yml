# ローカル開発では PostgreSQL のみ Docker で起動する。
# backend / frontend は各アプリで npm（npm run start:dev / npm run dev）で起動し、
# それぞれの .env を読む。backend を Docker で動かすとポート 3000 を占有し、
# .env の Cognito 設定が反映されず認証が食い違うため、compose には含めない。
# （apps/backend/Dockerfile は ECR/ECS 用に別途利用する。）
services:
  postgres:
    image: postgres:16
    container_name: health_tracker_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: health_tracker
    # ホスト側は 5433 を使う（別プロジェクトが 5432 を使うため競合回避）。
    # コンテナ内は従来どおり 5432。接続は apps/backend/.env の DATABASE_URL(localhost:5433)。
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
